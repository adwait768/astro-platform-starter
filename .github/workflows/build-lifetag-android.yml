name: Build LifeTag Android test APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'lifetag-app/**'
      - 'lifetag-native/**'
      - '.github/workflows/build-lifetag-android.yml'

permissions:
  contents: read
 njobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        working-directory: lifetag-native
        run: npm install
      - name: Copy web app assets
        working-directory: lifetag-native
        run: npm run build:web
      - name: Generate Android project
        working-directory: lifetag-native
        run: npx cap add android
      - name: Sync Android project
        working-directory: lifetag-native
        run: npx cap sync android
      - name: Build debug APK
        working-directory: lifetag-native/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: lifetag-android-debug-apk
          path: lifetag-native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
